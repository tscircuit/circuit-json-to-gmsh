# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Bun Test

on:
  pull_request:
  push:
    branches:
      - main
      - '!version-bumps/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    # Skip test for PRs that not chore: bump version
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.title != 'chore: bump version' }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Gmsh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libglu1-mesa
          python -m pip install -r lib/python/requirements-test.txt
      - name: Check Python
        run: python -m ruff check lib/python && python -m ruff format --check lib/python
      - name: Run tests
        env:
          GMSH_PYTHON: python
        run: bun test

      - name: Upload snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots
          path: |
            tests/**/__snapshots__/*.actual.png
            tests/**/__snapshots__/*.diff.png
          if-no-files-found: ignore
