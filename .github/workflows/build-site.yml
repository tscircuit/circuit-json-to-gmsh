name: Build visualizer
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build:site
      - uses: actions/upload-artifact@v4
        with:
          name: visualizer
          path: cosmos-export
